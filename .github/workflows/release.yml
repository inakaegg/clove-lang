name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the binaries to (for example v0.1.0)"
        required: true
        type: string

# Attaching assets needs write access, so each job asks for it on its own
# rather than granting it workflow-wide.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve the tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # The release is created here and not in the build matrix, because two
      # matrix jobs racing to create the same release would conflict.
      - name: Create the release if it does not exist yet
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; its assets will be replaced."
          else
            gh release create "$tag" --verify-tag --generate-notes
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # A step-level `if:` cannot read the `secrets` context, so whether the
      # signing material exists is copied into the job environment here.
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Say that the macOS archive will be unsigned
        if: runner.os == 'macOS' && env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::The signing secrets are not registered, so this macOS archive is neither signed nor notarized."
      # package.sh calls sign-macos.sh, which skips itself when the variables
      # below are empty; the archive is then published unsigned.
      - name: Build and package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: tools/release/package.sh --out-dir dist
      - name: List what the archive holds
        run: tar tzf dist/clove-*.tar.gz
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/clove-*.tar.gz --clobber

  checksums:
    name: Publish SHA256SUMS
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # One SHA256SUMS covers every platform, so it is written after the whole
      # matrix has uploaded rather than once per job.
      - name: Collect the archives already attached to the release
        run: gh release download "$TAG" --pattern 'clove-*.tar.gz' --dir dist --clobber
      - name: Write the checksums
        run: |
          cd dist
          sha256sum clove-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attach SHA256SUMS to the release
        run: gh release upload "$TAG" dist/SHA256SUMS --clobber
